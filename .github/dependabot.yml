# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  # Python packages: root library and the FastAPI app (updates pyproject.toml and uv.lock)
  - package-ecosystem: "uv"
    directories:
      - "/"
      - "/app"
    schedule:
      interval: "weekly"
    # Supply-chain guard: wait a week before proposing new releases (security updates are not delayed)
    cooldown:
      default-days: 7
    groups:
      # One PR for all minor/patch bumps; majors still get their own PR
      python-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    pull-request-branch-name:
      separator: "-"
    open-pull-requests-limit: 5

  # Docker base images
  - package-ecosystem: "docker"
    directories:
      - "/app"
      - "/src/tesseract_ocr"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    pull-request-branch-name:
      separator: "-"
    open-pull-requests-limit: 1

  # GitHub Actions (pinned to commit SHAs with a version comment)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "CI / actions"
    pull-request-branch-name:
      separator: "-"
    open-pull-requests-limit: 1
