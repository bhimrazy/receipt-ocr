name: Receipt OCR App Docker CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/receipt-ocr-app-docker.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/receipt-ocr-app-docker.yml"
  schedule:
    - cron: "0 0 * * *" # Runs every day at midnight UTC
  workflow_dispatch:

# Cancel superseded PR runs; every push to main still runs in full
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token; jobs need nothing more
permissions:
  contents: read

jobs:
  docker-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Docker image
        working-directory: app
        run: docker compose build

      # Pass secrets via env (not ${{ }} inside the script) to avoid shell injection.
      # Dependabot runs get no Actions secrets, so fall back to a dummy key: the
      # server still starts for the health checks, and the OCR tests are skipped.
      - name: Create .env file for testing
        id: env
        working-directory: app
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "has_openai_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::OPENAI_API_KEY not available; using a dummy key and skipping OCR endpoint tests"
            echo "has_openai_key=false" >> "$GITHUB_OUTPUT"
          fi
          {
            printf 'OPENAI_API_KEY=%s\n' "${OPENAI_API_KEY:-dummy-key-for-ci}"
            printf 'OPENAI_BASE_URL=%s\n' "$OPENAI_BASE_URL"
            printf 'OPENAI_MODEL=%s\n' "$OPENAI_MODEL"
          } > .env

      - name: Start services
        working-directory: app
        run: docker compose up -d

      - name: Wait for health check
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:8000/health; then
              echo "Service is healthy"
              break
            fi
            echo "Waiting for service to be healthy..."
            sleep 10
          done
          if [ $i -eq 30 ]; then
            echo "Service failed to become healthy"
            exit 1
          fi

      - name: Test health endpoint
        run: |
          response=$(curl -s http://localhost:8000/health)
          expected='{"status":"ok","service":"receipt-ocr-api"}'
          if [ "$response" != "$expected" ]; then
            echo "Health check failed. Expected: $expected, Got: $response"
            exit 1
          fi

      - name: Test OCR endpoint
        if: steps.env.outputs.has_openai_key == 'true'
        run: |
          echo "Testing OCR endpoint with default schema..."
          response=$(curl -s -X POST -F "file=@images/receipt.jpg" http://localhost:8000/ocr/)
          if echo "$response" | jq -e . >/dev/null 2>&1; then
            echo "✅ Valid JSON response received"
            echo "Response: $response"
          else
            echo "❌ Invalid JSON response: $response"
            exit 1
          fi

      - name: Test OCR endpoint with custom schema
        if: steps.env.outputs.has_openai_key == 'true'
        run: |
          echo "Testing OCR endpoint with custom schema..."
          response=$(curl -s -X POST -F "file=@images/receipt.jpg" -F 'json_schema={"merchant": "string", "total": "number"}' http://localhost:8000/ocr/)
          if echo "$response" | jq -e . >/dev/null 2>&1; then
            echo "✅ Valid JSON response received"
            echo "Response: $response"
          else
            echo "❌ Invalid JSON response: $response"
            exit 1
          fi

      - name: Show container logs
        if: failure()
        working-directory: app
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        working-directory: app
        run: docker compose down
