name: receipt-ocr CI

on:
  push:
    branches: [main]
    # paths:
    #   - 'src/receipt_ocr/**'
  pull_request:
    branches: [main]
    # paths:
    #   - 'src/receipt_ocr/**'
  workflow_dispatch:

# Cancel superseded PR runs; every push to main still runs in full
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/ruff-action@v3

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # macOS runners are limited to 5 concurrent jobs per account,
        # so only test the oldest and newest supported Python there
        include:
          - os: macos-26
            python-version: "3.10"
          - os: macos-26
            python-version: "3.13"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv and set Python version ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev
          uv pip list

      - name: Run tests
        run: uv run pytest --cov=src/receipt_ocr tests/receipt_ocr

      - name: Statistics
        run: |
          uv run coverage report
          uv run coverage xml -o coverage-receipt-ocr.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-receipt-ocr.xml
          flags: receipt_ocr
          env_vars: OS,PYTHON
          name: codecov-umbrella
          fail_ci_if_error: false
          slug: bhimrazy/receipt-ocr

      - name: Minimize uv cache
        run: uv cache prune --ci
