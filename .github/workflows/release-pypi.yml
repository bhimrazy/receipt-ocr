name: PyPI Release

# https://docs.astral.sh/uv/guides/integration/github/#publishing-to-pypi
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release-pypi.yml"
  release:
    types: [published]

# Each job declares only the permissions it needs
permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    # Supply-chain guard: skip PyPI releases newer than this. See https://docs.astral.sh/uv/reference/settings/#exclude-newer
    # Build job only: in publish it would break attest-action's own `uv run --locked`
    env:
      UV_EXCLUDE_NEWER: "2 days"
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache in release builds to avoid cache poisoning
      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.10"
          enable-cache: false

      - name: Build package
        run: uv build --no-sources

      - name: Verify package artifacts with twine
        run: uvx twine check --strict dist/*

      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with dist/*.whl tests/smoke_test.py

      - name: Smoke test (source distribution)
        run: uv run --isolated --no-project --with dist/*.tar.gz tests/smoke_test.py

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/receipt-ocr/
    permissions:
      # Mandatory for Trusted Publishing (OIDC) and attestations; no API token needed
      id-token: write

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7

      - name: Publish package to PyPI
        run: uv publish
