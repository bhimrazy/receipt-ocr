name: tesseract-ocr CI

on:
  push:
    branches: [main]
    # paths:
    #   - 'src/tesseract_ocr/**'
  pull_request:
    branches: [main]
    # paths:
    #   - 'src/tesseract_ocr/**'
  workflow_dispatch:

# Cancel superseded PR runs; every push to main still runs in full
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # macOS runners are limited to 5 concurrent jobs per account,
        # so only test the oldest and newest supported Python there
        include:
          - os: macos-26
            python-version: "3.10"
          - os: macos-26
            python-version: "3.13"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and set Python version ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          activate-environment: true
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install Tesseract OCR (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libtesseract-dev
          tesseract --version

      - name: Install Tesseract OCR (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install tesseract
          tesseract --version

      - name: Install Tesseract OCR (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install tesseract --yes
          $env:Path += ";C:\Program Files\Tesseract-OCR"
          echo "C:\Program Files\Tesseract-OCR" >> $env:GITHUB_PATH
          tesseract --help

      - name: Install dependencies
        run: |
          uv sync --locked --all-extras --dev
          uv pip list

      # requirements.txt is unpinned, so apply the supply-chain guard here.
      # See https://docs.astral.sh/uv/reference/settings/#exclude-newer
      - name: Install Tesseract OCR service requirements
        env:
          UV_EXCLUDE_NEWER: "2 days"
        run: |
          uv pip install -r src/tesseract_ocr/requirements.txt
          uv pip list

      - name: Run tests
        run: uv run pytest --cov=src/tesseract_ocr tests/tesseract_ocr

      - name: Statistics
        run: |
          uv run coverage report
          uv run coverage xml -o coverage-tesseract-ocr.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-tesseract-ocr.xml
          flags: tesseract_ocr
          env_vars: OS,PYTHON
          name: codecov-umbrella
          fail_ci_if_error: false
          slug: bhimrazy/receipt-ocr

      - name: Minimize uv cache
        run: uv cache prune --ci
